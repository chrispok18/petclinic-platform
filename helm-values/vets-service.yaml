# vets-service: MySQL-backed (RDS). Datasource comes from the rds-credentials Secret (External Secrets,
# k8s/base/external-secrets/rds-credentials.yaml): SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
serviceName: vets-service
component: service

image:
  name: vets-service
  tag: "32c63ef"   # commit SHA from the app repo CI (build-push.yml run #3)

service:
  port: 8083

# "production" must be listed explicitly: SPRING_PROFILES_ACTIVE replaces the app's own
# spring.profiles.active=production, and CacheConfig (Caffeine cache) is @Profile("production").
springProfiles: "docker,mysql,production"

waitFor:
  - name: config-server
    url: http://config-server:8888/application/default   # config-server has no actuator (see config-server.yaml)
  - name: discovery-server
    url: http://discovery-server:8761/actuator/health

envFromSecrets:
  - rds-credentials
