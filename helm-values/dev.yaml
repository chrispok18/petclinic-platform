# Dev environment overrides (technical-spec: Kubernetes Overlays > Dev, Helm Values Structure).
# Merged last by ArgoCD: chart values.yaml < helm-values/<service>.yaml < this file.

# The ONLY place the ECR registry (and so the AWS account ID) appears in the repo.
image:
  registry: 310971188778.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev

replicaCount: 1

# JVM memory request raised from the chart default 128Mi to 384Mi (limit stays 512Mi) for all 8
# services. Spring Boot services really use ~250-350Mi; a 128Mi request let the scheduler pack too
# many JVMs on one 2 GiB t4g.small. 384Mi = at most 3 JVMs per node by requests.
# Helm deep-merges this map, so per-service CPU values (api-gateway 200m/1000m) are kept.
resources:
  requests:
    memory: 384Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

# Rendered into every service ConfigMap.
commonConfig:
  CONFIG_SERVER_URL: http://config-server:8888

# Merged into the api-gateway Ingress (ingress.enabled is false for every other service).
ingress:
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: petclinic-dev-alb
    # Terraform-managed ALB SG (Name tag; the controller resolves names or IDs). Its rules already allow
    # 80 from the internet and 8080 to the node SG, which every pod carries via the launch template.
    alb.ingress.kubernetes.io/security-groups: petclinic-dev-alb-sg
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "false"
    alb.ingress.kubernetes.io/tags: Project=petclinic,Environment=dev,ManagedBy=aws-load-balancer-controller
