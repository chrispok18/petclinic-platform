apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "petclinic.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
data:
  {{- $data := merge (deepCopy .Values.config) (deepCopy .Values.commonConfig) }}
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
