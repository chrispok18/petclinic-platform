apiVersion: v1
kind: Service
metadata:
  name: {{ include "petclinic.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
    {{- if .Values.metrics.enabled }}
    petclinic.io/metrics: "true"   # selected by the petclinic-services ServiceMonitor
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "petclinic.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
