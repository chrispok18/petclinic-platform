# Restores the health check for argoproj.io/Application (removed from ArgoCD by default in v1.8).
# Without it the root app does not wait for a child Application to become Healthy before starting the
# next sync wave, so config-server -> discovery-server -> ... ordering would not be enforced.
# Apply AFTER installing ArgoCD (merge, keeps the rest of argocd-cm):
#   kubectl -n argocd patch configmap argocd-cm --type merge --patch-file k8s/argocd/install/argocd-cm-application-health.yaml
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
