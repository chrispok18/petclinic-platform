# ArgoCD Application: admin-server in dev (auto-sync, prune + self-heal).
# Sync wave 2 — after discovery-server.
# Waves are honoured because the root app (k8s/argocd/root/petclinic-dev.yaml) syncs these Applications
# and waits for each wave to be Healthy (needs the Application health check in
# k8s/argocd/install/argocd-cm-application-health.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-server-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: admin-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: argocd
    environment: dev
  finalizers:
    # Deleting the Application deletes its resources (for api-gateway: the Ingress, so the ALB is removed).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/chrispok18/petclinic-platform.git
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: admin-server
      valueFiles:
        - ../../helm-values/admin-server.yaml
        - ../../helm-values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # namespace + PSA labels come from k8s/base/namespaces.yaml
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
