# kube-prometheus-stack 93.4.1 — dev values (technical-spec: Observability).
# Installed by scripts/install-addons.sh:
#   helm upgrade --install kube-prometheus-stack kube-prometheus-stack \
#     --repo https://prometheus-community.github.io/helm-charts --version 93.4.1 \
#     -n monitoring -f k8s/base/observability/kube-prometheus-stack-values.yaml
#
# Dev choices: Alertmanager off, no PersistentVolumes (emptyDir; no EBS CSI driver in dev),
# 1-day retention, small requests to fit 5 x t4g.small.

# Short, predictable names: Service kps-prometheus (port-forwards.sh relies on it).
fullnameOverride: kps

alertmanager:
  enabled: false

windowsMonitoring:
  enabled: false

# EKS hides the control plane: these targets are unreachable and would show as DOWN.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
# kube-proxy binds its metrics to 127.0.0.1 on EKS.
kubeProxy:
  enabled: false

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

prometheus:
  prometheusSpec:
    retention: 1d
    retentionSize: 1GB
    scrapeInterval: 15s
    evaluationInterval: 15s
    storageSpec: {}            # emptyDir: nothing left behind at destroy
    # Pick up ServiceMonitors/rules that are not labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

  # Petclinic services (technical-spec: Prometheus > Scrape Targets).
  # Only services that ship micrometer-registry-prometheus get the label petclinic.io/metrics=true
  # (helm-values/<service>.yaml metrics.enabled): api-gateway, customers, visits, vets, genai.
  # config-server, discovery-server and admin-server have no /actuator/prometheus (404).
  additionalServiceMonitors:
    petclinic-services:
      jobLabel: app.kubernetes.io/name
      selector:
        matchLabels:
          app.kubernetes.io/part-of: petclinic
          petclinic.io/metrics: "true"
      namespaceSelector:
        matchNames:
          - petclinic-dev
      endpoints:
        - port: http
          path: /actuator/prometheus
          interval: 15s
          scrapeTimeout: 10s

grafana:
  fullnameOverride: grafana    # Service "grafana" (port 80)
  # Admin credentials come from Secret monitoring/grafana-admin, generated by install-addons.sh on
  # first run. The password is never in Git and never printed.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # The Spring Petclinic dashboard ConfigMap (petclinic-dashboard) lives in this namespace.
      searchNamespace: monitoring
    datasources:
      enabled: true            # provisions the "Prometheus" datasource the Petclinic dashboard uses
