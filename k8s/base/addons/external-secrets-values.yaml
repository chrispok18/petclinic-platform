# External Secrets Operator chart 2.15.0 (serves external-secrets.io/v1 only). Static dev values;
# the IRSA role ARN annotation is passed with --set by scripts/install-addons.sh.
installCRDs: true

serviceAccount:
  create: true
  name: external-secrets-sa       # referenced by the ClusterSecretStore jwt auth and the IRSA trust

replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
