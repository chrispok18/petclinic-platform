# technical-spec: Secrets Management > ExternalSecret Manifests (RDS Credentials).
# Source: petclinic/dev/rds-credentials, created by terraform/modules/rds as JSON
#   {"username","password","host","port","dbname","engine"}
# Target: Secret rds-credentials in petclinic-dev with exactly the three Spring env vars, loaded by
# customers-service, visits-service and vets-service via envFrom. No RDS endpoint is hardcoded anywhere:
# if RDS is recreated, ESO picks up the new host on the next refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: rds-credentials
          app.kubernetes.io/part-of: petclinic
      data:
        # sslMode=REQUIRED: TLS to RDS inside the VPC (replaces useSSL=false from the config repo's mysql profile).
        SPRING_DATASOURCE_URL: "jdbc:mysql://{{ .host }}:{{ .port }}/{{ .dbname }}?sslMode=REQUIRED"
        SPRING_DATASOURCE_USERNAME: "{{ .username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: petclinic/dev/rds-credentials
