# technical-spec: Secrets Management > ClusterSecretStore Configuration.
# API version: external-secrets.io/v1. ESO v2.15.0 (latest, Nov 2026) serves only v1; v1beta1 is
# deprecated and NOT served, so the spec's v1beta1 example would be rejected by the API server.
#
# Auth: ESO requests a token for external-secrets/external-secrets-sa and assumes the IRSA role
# petclinic-dev-eso-role (terraform output external_secrets_role_arn). That ServiceAccount must exist
# and carry the annotation eks.amazonaws.com/role-arn=<role ARN>; the role can only read petclinic/dev/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
